<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

body{
margin:0;
background:black;
}

.section{
position:relative;
}

.section img{
width:100%;
display:block;
}

/* кнопка карты */
.map-button{
position:absolute;
left:25%;
top:35%;
width:50%;
height:12%;
}

</style>
</head>

<body>

<div class="section">
<img src="1.png">
</div>

<div class="section">
<img src="2.png">

<a class="map-button" 
href="https://yandex.ru/maps/-/CPBMRQIC" 
target="_blank">
</a>

</div>

<div class="section">
<img src="3.png">
</div>

<div class="section">
<img src="4.png">
</div>

  <audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", function() {
  const music = document.getElementById("music");
  music.play();
}, { once: true });
</script>
  
</body>

</html>
